<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="무지개 쓰기">
<title>무지개 한글 쓰기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
  /* 하늘·언덕 놀이터 위에 칠판 하나. 왼쪽(세로 화면에선 위) 그림 카드, 가운데 칠판, 오른쪽(아래) 큰 버튼 */
  :root{
    --sky1:#a8dcff; --sky2:#e6f6ff; --grass:#8fd67d; --grass2:#74c867;
    --ink:#4a3b6b; --card:#ffffff; --pink:#ff4f9a; --sun:#ffd23f; --shadow:#cdbfee;
    --font:"Jua","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
    -webkit-touch-callout:none;touch-action:manipulation}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font-family:var(--font);
    background:linear-gradient(var(--sky1),var(--sky2) 70%)}
  button{font:inherit;color:var(--ink);border:0;cursor:pointer;background:var(--card)}
  button:focus-visible{outline:4px solid var(--pink);outline-offset:2px}

  /* ---------- 배경 ---------- */
  .sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .sun{position:absolute;right:4vmin;top:3vmin;width:16vmin;height:16vmin;border-radius:50%;
    background:radial-gradient(circle,#fff6a8 0 30%,var(--sun) 31% 48%,transparent 49%),
      repeating-conic-gradient(#ffe066 0 10deg,transparent 10deg 30deg);
    animation:spin 30s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .rainbow{position:absolute;left:-12vmin;bottom:8vmin;width:70vmin;height:35vmin;opacity:.55;
    background:radial-gradient(circle at 50% 100%,transparent 54%,#8e44ad 54% 57%,#3d7bff 57% 60%,#2ecc40 60% 63%,
      #f4d800 63% 66%,#ff9f1c 66% 69%,#ff3b3b 69% 72%,transparent 72%)}
  .hill{position:absolute;border-radius:50%;background:var(--grass)}
  .hill.a{left:-20vw;bottom:-28vh;width:80vw;height:45vh}
  .hill.b{right:-25vw;bottom:-30vh;width:90vw;height:48vh;background:var(--grass2)}
  .cloud{position:absolute;width:22vmin;height:7vmin;background:#fff;border-radius:7vmin;opacity:.95;
    animation:drift linear infinite}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .cloud::before{width:9vmin;height:9vmin;left:3vmin;top:-4.5vmin}
  .cloud::after{width:12vmin;height:12vmin;left:8vmin;top:-6.5vmin}
  @keyframes drift{from{transform:translateX(-40vw)}to{transform:translateX(130vw)}}
  .flower{position:absolute;bottom:2vh;font-size:5vmin;animation:sway 3s ease-in-out infinite;transform-origin:50% 100%}
  @keyframes sway{50%{transform:rotate(8deg)}}

  .screen{position:relative;z-index:1;height:100%;
    padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}

  /* ---------- 처음 화면 ---------- */
  #home{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vmin;overflow:auto}
  .logo{margin:0;font-size:clamp(34px,8vmin,80px);font-weight:400;text-align:center;line-height:1.1;
    background:linear-gradient(90deg,#ff3b3b,#ff9f1c,#e6c200,#2ecc40,#1e90ff,#8e44ad);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 0 #fff) drop-shadow(0 6px 0 rgba(0,0,0,.08))}
  .hello{display:flex;align-items:center;gap:12px;font-size:clamp(18px,3.4vmin,30px)}
  .hello .bear{font-size:clamp(48px,10vmin,96px);animation:idle 2.4s ease-in-out infinite}
  .hello .talk{background:var(--card);padding:10px 18px;border-radius:22px;box-shadow:0 4px 0 var(--shadow)}
  .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,2.4vmin,22px);
    width:min(92vw,820px)}
  .cardbtn{position:relative;border-radius:28px;padding:clamp(10px,2vmin,18px) 8px;display:flex;flex-direction:column;
    align-items:center;gap:2px;background:var(--c);box-shadow:0 8px 0 rgba(0,0,0,.15);color:#fff;
    transition:transform .15s}
  .cardbtn:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
  .cardbtn .big{font-size:clamp(48px,11vmin,110px);line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.15)}
  .cardbtn .t{font-size:clamp(18px,3.6vmin,32px)}
  .cardbtn .em{position:absolute;right:10px;top:8px;font-size:clamp(22px,4.5vmin,40px)}
  .cardbtn .cnt{font-size:clamp(13px,2.2vmin,18px);background:rgba(255,255,255,.3);padding:2px 10px;border-radius:12px}
  @media (max-aspect-ratio:3/4){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}

  /* ---------- 게임 화면 ---------- */
  #game{display:flex;flex-direction:column;gap:8px}
  .top{display:flex;align-items:center;gap:10px}
  .round{width:clamp(48px,8vmin,64px);height:clamp(48px,8vmin,64px);border-radius:50%;flex:none;
    font-size:clamp(22px,4vmin,32px);box-shadow:0 5px 0 var(--shadow);display:grid;place-items:center}
  .round:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
  #setTitle{font-size:clamp(20px,4vmin,34px);padding:4px 16px;border-radius:20px;color:#fff;background:var(--c,#ff7eb6);
    box-shadow:0 4px 0 rgba(0,0,0,.12);flex:none}
  #dots{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
  .dot{width:clamp(22px,3.6vmin,32px);height:clamp(22px,3.6vmin,32px);border-radius:50%;padding:0;
    font-size:clamp(11px,2vmin,16px);background:rgba(255,255,255,.75);display:grid;place-items:center}
  .dot.done{background:var(--sun)}
  .dot.now{outline:3px solid var(--pink);background:#fff}

  .play{flex:1;min-height:0;display:grid;gap:10px;
    grid-template-columns:minmax(150px,22%) 1fr auto;grid-template-areas:"side board ctrl"}
  .side{grid-area:side;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0;justify-content:center}
  .board{grid-area:board;min-width:0;min-height:0;display:grid;place-items:center}
  .ctrl{grid-area:ctrl;display:flex;flex-direction:column;gap:14px;justify-content:center}
  .picCard{background:var(--card);border-radius:28px;padding:14px 16px;text-align:center;box-shadow:0 6px 0 var(--shadow);width:100%}
  .picCard{cursor:pointer;font:inherit;color:inherit;border:0}
  .picCard:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow)}
  #picTip{display:block;font-size:clamp(12px,2vmin,17px);margin-top:4px;color:var(--pink)}
  .strip{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .strip span{font-size:clamp(24px,4.6vmin,42px);background:var(--card);border-radius:14px;padding:2px 10px;
    box-shadow:0 3px 0 var(--shadow);color:#cbc2e2;min-width:1.4em;text-align:center}
  .strip span.now{color:var(--ink);outline:3px solid var(--pink)}
  .strip span.ok{color:#fff;background:linear-gradient(135deg,#ff6b6b,#ffb347,#7ed957,#4fb3ff,#b38cff)}
  #pic{font-size:clamp(40px,9vmin,96px);line-height:1.1;word-break:break-all}
  #pic.small{font-size:clamp(22px,4.4vmin,40px)}
  #word{font-size:clamp(20px,4vmin,34px)}
  #lname{font-size:clamp(14px,2.6vmin,22px);opacity:.7}
  .bounce{animation:bounce .7s}
  @keyframes bounce{30%{transform:scale(1.3) rotate(-6deg)}60%{transform:scale(.92) rotate(5deg)}}
  .buddy{display:flex;flex-direction:column;align-items:center;gap:4px}
  .bubble{background:var(--card);border-radius:20px;padding:8px 14px;font-size:clamp(15px,2.8vmin,22px);
    box-shadow:0 4px 0 var(--shadow);text-align:center;position:relative;max-width:100%}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-10px;border:10px solid transparent;border-bottom:0;border-top-color:var(--card)}
  #mascot{font-size:clamp(46px,9vmin,90px);animation:idle 2.4s ease-in-out infinite;transform-origin:50% 100%}
  #mascot.cheer{animation:cheer .45s 4}
  @keyframes idle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-4px)}}
  @keyframes cheer{50%{transform:translateY(-28px) scale(1.2)}}
  .big-btn{width:clamp(64px,11vmin,96px);height:clamp(64px,11vmin,96px);border-radius:26px;font-size:clamp(28px,5.5vmin,46px);
    box-shadow:0 6px 0 var(--shadow);display:grid;place-items:center}
  .big-btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--shadow)}
  .big-btn.go{background:var(--sun);box-shadow:0 6px 0 #e0a800}
  .big-btn.pulse{animation:pulse 1s infinite}
  @keyframes pulse{50%{transform:scale(1.12)}}

  .stage{position:relative;border-radius:34px;border:8px solid transparent;
    background:linear-gradient(var(--card),var(--card)) padding-box,
      linear-gradient(135deg,#ff3b3b,#ff9f1c,#f4d800,#2ecc40,#1e90ff,#8e44ad) border-box;
    box-shadow:0 10px 0 rgba(0,0,0,.08)}
  .stage canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:26px}
  #draw{touch-action:none!important;cursor:crosshair}
  #fx,#hint{pointer-events:none}
  .pop{animation:pop .6s}
  @keyframes pop{40%{transform:scale(1.04) rotate(-1.5deg)}}

  /* 세로 화면(아이패드 세로·휴대폰) */
  @media (max-aspect-ratio:1/1){
    .play{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"side" "board" "ctrl"}
    .side{flex-direction:row;justify-content:center}
    .picCard{width:auto;display:flex;align-items:center;gap:12px;padding:8px 16px}
    .buddy{flex-direction:row-reverse}
    .bubble::after{display:none}
    .ctrl{flex-direction:row;justify-content:center}
  }
  /* 처음 화면 아래 줄: 단어장·그림 */
  .cards2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,2.4vmin,22px);width:min(92vw,820px)}
  .cards2 .cardbtn{flex-direction:row;justify-content:center;gap:14px;padding:clamp(10px,2vmin,16px)}
  .cards2 .cardbtn .big{font-size:clamp(36px,7vmin,64px)}
  .ttl{font-size:clamp(20px,4vmin,34px);padding:4px 16px;border-radius:20px;color:#fff;background:var(--c);box-shadow:0 4px 0 rgba(0,0,0,.12);flex:none}
  .spacer{flex:1}

  /* 단어장 */
  #book{display:flex;flex-direction:column;gap:10px}
  .tabs2{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
  .tab2{font-size:clamp(16px,3vmin,24px);padding:6px 14px;border-radius:18px;box-shadow:0 4px 0 var(--shadow)}
  .tab2.on{color:#fff;background:var(--c);box-shadow:0 4px 0 rgba(0,0,0,.15)}
  .bookGrid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(130px,20vmin,190px),1fr));
    gap:clamp(10px,2vmin,18px);align-content:start;padding:6px 4px 20px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
  .wcard{position:relative;background:var(--card);border-radius:24px;padding:12px 8px 10px;box-shadow:0 6px 0 var(--shadow);
    display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
  .wcard:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow)}
  .wcard .e{font-size:clamp(48px,9vmin,80px);line-height:1.1}
  .wcard .k{font-size:clamp(20px,3.6vmin,30px)}
  .wcard .en{font-size:clamp(13px,2.2vmin,18px);opacity:.6}
  .wcard .wr{margin-top:6px;font-size:clamp(15px,2.6vmin,20px);padding:4px 14px;border-radius:14px;background:var(--sun);box-shadow:0 3px 0 #e0a800}
  .wcard .st{position:absolute;right:10px;top:8px;font-size:20px}

  /* 그림 그리기 */
  #paint{display:flex;flex-direction:column;gap:8px}
  .pwrap{position:relative;flex:1;min-height:0;border-radius:26px;overflow:hidden;background:#fff;border:6px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.08)}
  .pwrap canvas{position:absolute;inset:0;width:100%;height:100%}
  #pcv{touch-action:none!important;cursor:crosshair}
  .ptools{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;align-items:center}
  .grp{display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.7);padding:6px 8px;border-radius:22px}
  .sw{width:clamp(34px,5.6vmin,46px);height:clamp(34px,5.6vmin,46px);border-radius:50%;padding:0;box-shadow:0 3px 0 rgba(0,0,0,.15);border:3px solid #fff}
  .sw.rb{background:conic-gradient(#ff3b3b,#ff9f1c,#ffd60a,#2ecc40,#1e90ff,#8e44ad,#ff3b3b)}
  .sw.on,.tool.on,.sz.on{outline:4px solid var(--pink);outline-offset:1px}
  .sz{width:clamp(34px,5.6vmin,46px);height:clamp(34px,5.6vmin,46px);border-radius:50%;padding:0;display:grid;place-items:center;box-shadow:0 3px 0 var(--shadow)}
  .sz i{display:block;border-radius:50%;background:var(--ink)}
  .tool.pulse{animation:pulse 1s infinite}
  .tool{width:clamp(44px,7vmin,58px);height:clamp(44px,7vmin,58px);border-radius:18px;font-size:clamp(22px,4vmin,30px);box-shadow:0 4px 0 var(--shadow);padding:0}
  .pmsg{display:inline-block;background:var(--card);border-radius:18px;padding:6px 14px;font-size:clamp(14px,2.6vmin,22px);box-shadow:0 3px 0 var(--shadow)}
  .pick{position:fixed;inset:0;z-index:10;background:rgba(74,59,107,.35);display:grid;place-items:center;padding:16px}
  .pickbox{background:var(--card);border-radius:30px;padding:18px;width:min(94vw,820px);max-height:88vh;overflow:auto;box-shadow:0 10px 0 rgba(0,0,0,.12)}
  .pickbox h2{margin:0 0 12px;text-align:center;font-weight:400;font-size:clamp(22px,4vmin,34px)}
  .pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(96px,15vmin,130px),1fr));gap:10px}
  .pk{border-radius:22px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;background:#f6f1ff;box-shadow:0 4px 0 var(--shadow)}
  .pk:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
  .pk .e{font-size:clamp(36px,7vmin,56px);line-height:1.1}
  .pk .n{font-size:clamp(14px,2.6vmin,20px)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="sun"></div>
  <div class="cloud" style="top:8vh;animation-duration:70s;animation-delay:-20s"></div>
  <div class="cloud" style="top:22vh;animation-duration:95s;animation-delay:-60s;transform:scale(.7)"></div>
  <div class="cloud" style="top:14vh;animation-duration:80s;animation-delay:-45s"></div>
  <div class="rainbow"></div>
  <div class="hill a"></div><div class="hill b"></div>
  <span class="flower" style="left:6vw">🌷</span>
  <span class="flower" style="left:20vw;animation-delay:.6s">🌼</span>
  <span class="flower" style="right:24vw;animation-delay:1.2s">🌻</span>
  <span class="flower" style="right:8vw;animation-delay:.3s">🍄</span>
</div>

<!-- 처음 화면 -->
<section id="home" class="screen">
  <h1 class="logo">🌈 무지개 글씨 놀이</h1>
  <div class="hello"><span class="bear">🐻</span><span class="talk">무엇을 써 볼까? 하나를 눌러 봐!</span></div>
  <div class="cards" id="cards"></div>
  <div class="cards2">
    <button class="cardbtn" id="goBook" style="--c:#13b5a6"><span class="big">📚</span><span class="t">단어장</span></button>
    <button class="cardbtn" id="goPaint" style="--c:#ff7b54"><span class="big">🎨</span><span class="t">그림 그리기</span></button>
  </div>
</section>

<!-- 단어장 -->
<section id="book" class="screen" hidden>
  <header class="top">
    <button class="round" id="bookHome" aria-label="처음으로">🏠</button>
    <div class="ttl" style="--c:#13b5a6">📚 단어장</div>
    <div class="tabs2" id="bookTabs"></div>
  </header>
  <div class="bookGrid" id="bookGrid"></div>
</section>

<!-- 그림 그리기 -->
<section id="paint" class="screen" hidden>
  <header class="top">
    <button class="round" id="paintHome" aria-label="처음으로">🏠</button>
    <div class="ttl" style="--c:#ff7b54">🎨 그림 그리기</div>
    <div class="spacer"><span class="pmsg" id="pmsg">🖼️ 눌러서 따라 그릴 그림을 골라 봐!</span></div>
    <button class="round" id="pTpl" aria-label="따라 그릴 그림 고르기">🖼️</button>
    <button class="round" id="pUndo" aria-label="되돌리기">↩️</button>
    <button class="round" id="pClear" aria-label="모두 지우기">🗑️</button>
    <button class="round" id="pSave" aria-label="그림 저장">💾</button>
  </header>
  <div class="pick" id="pick" hidden><div class="pickbox"><h2>무엇을 따라 그릴까?</h2><div class="pickgrid" id="pickgrid"></div></div></div>
  <div class="pwrap" id="pwrap"><canvas id="pguide"></canvas><canvas id="pcv"></canvas></div>
  <div class="ptools">
    <div class="grp" id="pColors"></div>
    <div class="grp" id="pSizes"></div>
    <div class="grp">
      <button class="tool on" data-t="pen" aria-label="펜">✏️</button>
      <button class="tool" data-t="fill" aria-label="색 채우기">🪣</button>
      <button class="tool" data-t="stamp" id="stampBtn" aria-label="스탬프">⭐</button>
      <button class="tool" data-t="eraser" aria-label="지우개">🧽</button>
    </div>
  </div>
</section>

<!-- 게임 화면 -->
<section id="game" class="screen" hidden>
  <header class="top">
    <button class="round" id="homeBtn" aria-label="처음으로">🏠</button>
    <div id="setTitle"></div>
    <div id="dots"></div>
    <button class="round" id="mute" aria-label="소리 켜고 끄기">🔊</button>
  </header>
  <main class="play">
    <aside class="side">
      <button class="picCard" id="picCard" aria-label="낱말 쓰기"><div id="pic"></div><div><div id="word"></div><div id="lname"></div><span id="picTip"></span></div></button>
      <div class="strip" id="strip" hidden></div>
      <div class="buddy"><div class="bubble" id="msg"></div><div id="mascot">🐻</div></div>
    </aside>
    <div class="board" id="board">
      <div class="stage" id="stage">
        <canvas id="guide"></canvas><canvas id="draw"></canvas><canvas id="hint"></canvas><canvas id="fx"></canvas>
      </div>
    </div>
    <nav class="ctrl">
      <button class="big-btn" id="prev" aria-label="이전 글자">⬅️</button>
      <button class="big-btn" id="clear" aria-label="지우고 다시">🧽</button>
      <button class="big-btn" id="say" aria-label="소리 듣기">👂</button>
      <button class="big-btn go" id="next" aria-label="다음 글자">➡️</button>
    </nav>
  </main>
</section>

<script>
window.onerror=function(m,s,l){var e=document.getElementById('msg');if(e)e.textContent='⚠️ 오류: '+m+' (줄 '+l+')';};

// ================= 획 도우미 =================
// 화면 좌표(아래가 +y). 각도 0=오른쪽, 90=아래, -90=위. a0→a1 방향으로 점을 찍음
function arc(cx,cy,rx,ry,a0,a1){var n=Math.max(8,Math.round(Math.abs(a1-a0)/8)),p=[];
  for(var i=0;i<=n;i++){var t=(a0+(a1-a0)*i/n)*Math.PI/180;p.push([cx+rx*Math.cos(t),cy+ry*Math.sin(t)])}return p}
function cat(){var r=[];for(var i=0;i<arguments.length;i++)r=r.concat(arguments[i]);return r}

var gctx=guide.getContext('2d'),dctx=draw.getContext('2d'),hctx=hint.getContext('2d'),fctx=fx.getContext('2d');
var strokes=[],hit=null,nearMask=null,inkOn=false,hue=0,last=null,lastCheck=0,moveDist=0,noteI=0,shown=0;

// ================= 소리 =================
var ac=null;

function tone(f,d,type,v,delay,to){
  if(muted)return; var a=A(); if(!a)return; var t=a.currentTime+(delay||0);
  var o=a.createOscillator(),g=a.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.015); g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d+.02);
}
var PENTA=[523,587,659,784,880,1047,1175,1319];
var sfx={
  click:function(){tone(500,.08,'triangle',.18,0,700)},

  note:function(){tone(PENTA[noteI++%PENTA.length],.18,'sine',.09)},
  stroke:function(){tone(784,.12,'triangle',.22);tone(1047,.2,'triangle',.22,.09);tone(1568,.25,'sine',.1,.09)},
  oops:function(){tone(330,.2,'sine',.12,0,260)},
  win:function(){[523,659,784,1047,1319].forEach(function(f,i){tone(f,.28,'triangle',.25,i*.1)});
       [1568,1760,2093].forEach(function(f,i){tone(f,.3,'sine',.1,.5+i*.08)})},

    list.forEach(function(t){var u=new SpeechSynthesisUtterance(t);u.lang=set.lang;if(v)u.voice=v;u.rate=set.lang==='en-US'?.8:.85;u.pitch=1.2;speechSynthesis.speak(u)});
  }catch(e){}
}

}

  if(!wordChars.length)return;
  wordMode=true; wi=0; wordDone=false; load(); speak([wordText]);
}

  st.innerHTML=''; wordChars.forEach(function(c,i){var sp=document.createElement('span');sp.textContent=c;
    sp.className=(i<wi||(i===wi&&done))?'ok':(i===wi?'now':''); st.appendChild(sp)});
}
$('picCard').onclick=function(){A();sfx.click();if(set.word){speakMix([[cur()[3],'ko-KR'],[cur()[1],'en-US']]);return}if(wordMode){exitWord();load();sayLetter()}else enterWord()};

    b.onclick=function(){A();sfx.click();exitWord();idx=i;load();sayLetter()};d.appendChild(b)});

}

  var bs=$('dots').children;
  for(var i=0;i<bs.length;i++){var it=set.items[i],dn=isDone(set,it[0]);
    bs[i].className='dot'+(dn?' done':'')+(i===idx?' now':''); bs[i].textContent=dn?'⭐':(i===idx?it[0].charAt(0):'')}

// ================= 크기 =================
function fit(force){
  if($('game').hidden)return;
  var r=board.getBoundingClientRect(), s=Math.floor(Math.min(r.width,r.height));
  if(s<120)return;
  var newW=s-16; if(!force&&Math.abs(newW-W)<3)return;
  stage.style.width=stage.style.height=s+'px';
  W=newW; dpr=Math.min(window.devicePixelRatio||1,2);
  [guide,draw,hint,fx].forEach(function(c){c.width=c.height=Math.floor(W*dpr)});
  load();
}

// ================= 글자 불러오기 =================
function path(c,pts){c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1])}
function at(s,d){
  d=Math.max(0,Math.min(s.L,d)); var i=1; while(i<s.cum.length-1&&s.cum[i]<d)i++;
  var a=s.pts[i-1],b=s.pts[i],sg=(s.cum[i]-s.cum[i-1])||1,t=(d-s.cum[i-1])/sg;
  return {p:[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t],ang:Math.atan2(b[1]-a[1],b[0]-a[0])};
}
function msg(t){$('msg').textContent=t}
function load(){
  if(!W)return;
  if(set.word&&!wordMode){wordText=cur()[3];wordChars=wordText.split('').filter(function(c){return isHangul(c)});wordMode=true;wi=0;wordDone=false}
  var it=cur(),ch=target();
  done=false; last=null; inkOn=false; noteI=0; BK=thin(ch)?.056:.068;
  $('next').classList.remove('pulse');
  $('pic').textContent=it[2]; $('pic').className=(it[2].length>4?'small ':'')+'bounce';
  void $('pic').offsetWidth;
  $('word').textContent=it[3];
  $('lname').textContent=it[1]===it[0]?it[0]:(it[0]+'  ·  '+it[1]);
  $('picTip').textContent=set.word?'👂 눌러서 듣기':wordMode?'↩️ 눌러서 글자로 돌아가기':'✏️ 눌러서 낱말 쓰기';
  $('mascot').className=''; paintDots(); paintStrip();
  msg(wordMode?('「'+wordText+'」 쓰기! '+(wi+1)+'번째 글자 「'+ch+'」'):'①번부터 화살표를 따라 써 봐!');
  [draw,fx].forEach(function(c){var x=c.getContext('2d');x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.width,c.height)});
  dctx.setTransform(dpr,0,0,dpr,0,0); fctx.setTransform(dpr,0,0,dpr,0,0);

  strokes=strokesFor(ch).map(function(s){
    var pts=s.map(function(q){return [q[0]*W,q[1]*W]}), cum=[0];
    for(var i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
    var o={pts:pts,cum:cum,L:cum[cum.length-1],done:false,probes:[]};
    var n=Math.max(4,Math.round(o.L/(brush()*0.45)));
    for(var k=0;k<=n;k++)o.probes.push(at(o,o.L*k/n).p);
    return o;
  });

  gctx.setTransform(dpr,0,0,dpr,0,0); gctx.clearRect(0,0,W,W); gctx.lineCap=gctx.lineJoin='round';
  // 공책 줄 (영어 소문자는 4선)
  gctx.strokeStyle='#eef3fb'; gctx.lineWidth=2;
  var lines=LO[ch]?[.04,.38,.77,.96].map(function(y){return .04+y*.92}):[.5];
  lines.forEach(function(y){gctx.beginPath();gctx.moveTo(W*.05,W*y);gctx.lineTo(W*.95,W*y);gctx.stroke()});
  gctx.beginPath();gctx.moveTo(W*.5,W*.05);gctx.lineTo(W*.5,W*.95);if(!LO[ch])gctx.stroke();
  strokes.forEach(function(s){path(gctx,s.pts);gctx.strokeStyle='#ece6f8';gctx.lineWidth=brush()*1.25;gctx.stroke()});
  gctx.setLineDash([W*.018,W*.024]);
  strokes.forEach(function(s){path(gctx,s.pts);gctx.strokeStyle='#b8a9dd';gctx.lineWidth=Math.max(2,W*.005);gctx.stroke()});
  gctx.setLineDash([]);

  var o=document.createElement('canvas'); o.width=o.height=W; var oc=o.getContext('2d');
  oc.lineCap=oc.lineJoin='round'; oc.strokeStyle='#000'; oc.lineWidth=brush()*2.2;
  strokes.forEach(function(s){path(oc,s.pts);oc.stroke()});
  var d=oc.getImageData(0,0,W,W).data; nearMask=new Uint8Array(W*W);
  for(var i=0;i<W*W;i++)nearMask[i]=d[i*4+3]>100?1:0;
  hit=new Uint8Array(W*W);
}

// ================= 그리기 =================
var sparks=[];
function pos(e){var r=draw.getBoundingClientRect();return [(e.clientX-r.left)*(W/r.width),(e.clientY-r.top)*(W/r.height)]}
function seg(p,q){
  var dd=Math.hypot(q[0]-p[0],q[1]-p[1]);
  hue=(hue+dd*.9)%360;
  dctx.strokeStyle='hsl('+hue+',95%,55%)'; dctx.lineWidth=brush(); dctx.lineCap=dctx.lineJoin='round';
  dctx.beginPath(); dctx.moveTo(p[0],p[1]); dctx.lineTo(q[0],q[1]); dctx.stroke();
  var r=Math.ceil(brush()/2),steps=Math.max(1,Math.ceil(dd/(r/2)));
  for(var i=0;i<=steps;i++){
    var x=p[0]+(q[0]-p[0])*i/steps,y=p[1]+(q[1]-p[1])*i/steps;
    var x0=Math.max(0,Math.floor(x-r)),x1=Math.min(W-1,Math.ceil(x+r)),y0=Math.max(0,Math.floor(y-r)),y1=Math.min(W-1,Math.ceil(y+r));
    for(var yy=y0;yy<=y1;yy++)for(var xx=x0;xx<=x1;xx++){var dx=xx-x,dy=yy-y;if(dx*dx+dy*dy<=r*r)hit[yy*W+xx]=1}
  }
  moveDist+=dd; if(moveDist>W*.05){moveDist=0;sfx.note()}
  if(Math.random()<.5)sparks.push({x:q[0]+(Math.random()-.5)*brush(),y:q[1]+(Math.random()-.5)*brush(),life:1,c:hue});
}
draw.addEventListener('pointerdown',function(e){
  A();
  if(done){if(performance.now()-winAt>500&&(!wordMode||wordDone)){if(wordMode)exitWord();goNext()}return}   // 완성 뒤 한 번 더 누르면 다음 글자
  try{draw.setPointerCapture(e.pointerId)}catch(_){}
  inkOn=true; last=pos(e); sfx.start(); seg(last,[last[0]+.01,last[1]]);
});
draw.addEventListener('pointermove',function(e){
  if(!inkOn||done)return;
  var evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[]; if(!evs.length)evs=[e];
  for(var i=0;i<evs.length;i++){var p=pos(evs[i]);seg(last,p);last=p}
  var now=performance.now(); if(now-lastCheck>120){lastCheck=now;check(false)}
});
function end(){if(!inkOn)return;inkOn=false;check(true)}
draw.addEventListener('pointerup',end); draw.addEventListener('pointercancel',end);

function covered(i){return hit[i]||hit[i+1]||hit[i-1]||hit[i+W]||hit[i-W]}
function check(final){
  if(done)return;
  var all=true;
  strokes.forEach(function(s){
    if(s.done)return;
    var c=0; s.probes.forEach(function(q){if(covered(Math.round(q[1])*W+Math.round(q[0])))c++});
    if(c/s.probes.length>=.8){s.done=true;sfx.stroke();burst(s.probes[s.probes.length>>1],10)}
    else all=false;
  });
  var k=strokes.filter(function(s){return s.done}).length;
  if(!all){ if(final) msg(k?'좋아! 이제 '+(k+1)+'번을 써 볼까?':'점선 위를 꾹~ 따라가 봐!'); return }
  var ink=0,out=0;
  for(var y=0;y<W;y+=8)for(var x=0;x<W;x+=8){var i=y*W+x;if(hit[i]||hit[i+1]||hit[i+W]){ink++;if(!nearMask[i])out++}}
  if(ink>0&&out/ink>.35){ if(final){sfx.oops();msg('선 밖으로 많이 나갔어. 🧽 눌러서 다시 해 보자!')} return }
  if(final)win();
}

// ================= 완성 =================
function win(){
  done=true; winAt=performance.now();
  if(wordMode&&wi<wordChars.length-1){ // 낱말 중간 글자 완성 -> 잠깐 뒤 다음 글자
    speak([wordChars[wi]]); sfx.stroke(); burst([W/2,W/2],24); paintStrip(); fillRainbow();
    msg('좋아! 다음 글자로~');
    setTimeout(function(){if(wordMode&&done&&!wordDone){wi++;load()}},900);
    return;
  }
  if(wordMode){ wordDone=true; if(set.word){doneMap[set.key+':'+cur()[0]]=1;saveDone();paintDots()} paintStrip(); speak([wordText]); sfx.win(); confetti(); fillRainbow();
    var m0=$('mascot'); m0.className=''; void m0.offsetWidth; m0.className='cheer';
    msg('「'+wordText+'」 완성! 👆 한 번 더 누르면 다음!'); $('next').classList.add('pulse'); return; }
  var it=cur(); doneMap[set.key+':'+it[0]]=1; saveDone(); paintDots();
  sayAll(); sfx.win(); confetti();
  stage.classList.remove('pop'); void stage.offsetWidth; stage.classList.add('pop');
  $('pic').className=(it[2].length>4?'small ':''); void $('pic').offsetWidth; $('pic').className+=' bounce';
  fillRainbow();
  var m=$('mascot'); m.className=''; void m.offsetWidth; m.className='cheer';
  msg(['최고야!','멋져요!','대단해!','와~ 잘했다!'][Math.floor(Math.random()*4)]+' 👆 한 번 더 누르면 다음!');
  $('next').classList.add('pulse');
}
function fillRainbow(){
  var g=dctx.createLinearGradient(0,0,W,W);
  ['#ff3b3b','#ff9f1c','#f4d800','#2ecc40','#1e90ff','#8e44ad'].forEach(function(c,i){g.addColorStop(i/5,c)});
  dctx.save(); dctx.strokeStyle=g; dctx.lineWidth=brush()*1.05; dctx.lineCap=dctx.lineJoin='round';
  strokes.forEach(function(s){path(dctx,s.pts);dctx.stroke()}); dctx.restore();
}
function goNext(){
  sfx.next();
  if(set.word){exitWord();idx=(idx+1)%set.items.length;load();sayLetter();return}
  if(idx<set.items.length-1)idx++;
  else{ set=SETS[(SETS.indexOf(set)+1)%SETS.length]; idx=0; $('setTitle').textContent=set.title; $('setTitle').style.setProperty('--c',set.c); buildDots() }
  load(); sayLetter();
}
$('clear').onclick=function(){A();sfx.click();wordDone=false;load()};
$('say').onclick=function(){A();sayAll()};
$('next').onclick=function(){A();if(wordMode&&wi<wordChars.length-1){sfx.next();wi++;load();speak([wordChars[wi]]);return}if(wordMode)exitWord();goNext()};

// ================= 효과 + 화살표 =================
var bursts=[],conf=[];
function burst(p,n){for(var i=0;i<n;i++)bursts.push({x:p[0],y:p[1],vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,life:1,c:Math.random()*360})}
function confetti(){var cols=['#ff3b3b','#ff9f1c','#f4d800','#2ecc40','#1e90ff','#8e44ad','#ff6fb5'];
  for(var i=0;i<130;i++)conf.push({x:W/2,y:W/2,vx:(Math.random()-.5)*15,vy:-Math.random()*15-3,s:W*.02*(.6+Math.random()),c:cols[i%7],r:Math.random()*6,vr:(Math.random()-.5)*.4,life:110})}
function arrow(p,ang,sz,col,glow){
  hctx.save(); hctx.translate(p[0],p[1]); hctx.rotate(ang);
  if(glow){hctx.shadowColor='#fff';hctx.shadowBlur=12}
  hctx.beginPath(); hctx.moveTo(sz,0); hctx.lineTo(-sz*.8,-sz*.9); hctx.lineTo(-sz*.3,0); hctx.lineTo(-sz*.8,sz*.9); hctx.closePath();
  hctx.fillStyle=col; hctx.fill(); if(glow){hctx.lineWidth=3;hctx.strokeStyle='#fff';hctx.stroke()} hctx.restore();
}
function star(c,x,y,r){c.beginPath();for(var i=0;i<10;i++){var a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;c.lineTo(x+rr*Math.cos(a),y+rr*Math.sin(a))}c.closePath();c.fill()}
function badge(s,i,act){
  var R=W*(act?.04:.03),sx=s.pts[0][0],sy=s.pts[0][1];
  hctx.beginPath(); hctx.arc(sx,sy,R,0,7); hctx.fillStyle=act?'#ff4f9a':'#b7a9da'; hctx.fill();
  hctx.lineWidth=3; hctx.strokeStyle='#fff'; hctx.stroke();
  hctx.fillStyle='#fff'; hctx.font='bold '+(R*1.3)+'px sans-serif'; hctx.textAlign='center'; hctx.textBaseline='middle';
  hctx.fillText(i+1,sx,sy+1);
}
function frame(t){
  if(W&&strokes.length&&!$('game').hidden){
    hctx.setTransform(dpr,0,0,dpr,0,0); hctx.clearRect(0,0,W,W);
    if(!done){
      var ai=-1; for(var i=0;i<strokes.length;i++)if(!strokes[i].done){ai=i;break}
      strokes.forEach(function(s,i){if(!s.done&&i!==ai)badge(s,i,false)});
      if(ai>=0){
        var s=strokes[ai], cnt=Math.max(1,Math.floor(s.L/(W*.09)));
        for(var k=1;k<=cnt;k++){var q=at(s,s.L*k/(cnt+1));arrow(q.p,q.ang,W*.022,'rgba(255,79,154,.55)')}
        var m=at(s,s.L*((t%1800)/1800)); arrow(m.p,m.ang,W*.04,'#ff4f9a',true);
        badge(s,ai,true);
      }
    }
    fctx.setTransform(dpr,0,0,dpr,0,0); fctx.clearRect(0,0,W,W);
    sparks.forEach(function(p){p.life-=.035;fctx.globalAlpha=Math.max(0,p.life);fctx.fillStyle='hsl('+p.c+',100%,65%)';star(fctx,p.x,p.y,W*.012*(p.life+.3))});
    bursts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.life-=.03;fctx.globalAlpha=Math.max(0,p.life);fctx.fillStyle='hsl('+p.c+',100%,60%)';star(fctx,p.x,p.y,W*.02)});
    fctx.globalAlpha=1;
    conf.forEach(function(p){p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;
      fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.r);fctx.fillStyle=p.c;fctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);fctx.restore()});
    sparks=sparks.filter(function(p){return p.life>0}); bursts=bursts.filter(function(p){return p.life>0});
    conf=conf.filter(function(p){return p.life>0&&p.y<W*1.2});
  }
  requestAnimationFrame(frame);
}

function pfit(){
  if($('paint').hidden)return;
  var r=pwrap.getBoundingClientRect(),w=Math.floor(r.width-12),h=Math.floor(r.height-12);
  if(w<80||h<80||(w===PW&&h===PH))return;
  var old=null; if(PW){old=document.createElement('canvas');old.width=pcv.width;old.height=pcv.height;old.getContext('2d').drawImage(pcv,0,0)}
  PW=w;PH=h;pdpr=Math.min(window.devicePixelRatio||1,2);
  [pcv,pg].forEach(function(c){c.width=Math.floor(PW*pdpr);c.height=Math.floor(PH*pdpr)});
  pctx.setTransform(1,0,0,1,0,0); if(old)pctx.drawImage(old,0,0,pcv.width,pcv.height);
  pctx.setTransform(pdpr,0,0,pdpr,0,0); undoStack=[]; drawTpl();
}

function tplBox(){var S=Math.min(PW,PH)*.92;return {S:S,x0:(PW-S)/2,y0:(PH-S)/2}}
function drawTpl(){
  pgx.setTransform(1,0,0,1,0,0); pgx.clearRect(0,0,pg.width,pg.height); pgx.setTransform(pdpr,0,0,pdpr,0,0);
  if(tplI<0)return;
  var b=tplBox(); pgx.lineCap=pgx.lineJoin='round';
  if(traced){pgx.setLineDash([]);pgx.strokeStyle='#5a5470';pgx.lineWidth=Math.max(4,b.S*.012)}
  else{pgx.setLineDash([b.S*.018,b.S*.022]);pgx.strokeStyle='#a99bd3';pgx.lineWidth=Math.max(4,b.S*.011)}
  TPLS[tplI].s.forEach(function(st){pgx.beginPath();st.forEach(function(q,i){var x=b.x0+q[0]*b.S,y=b.y0+q[1]*b.S;i?pgx.lineTo(x,y):pgx.moveTo(x,y)});pgx.stroke()});
  pgx.setLineDash([]);
}
function checkTrace(){
  if(tplI<0||traced)return;
  var b=tplBox(),w=pcv.width,h=pcv.height,d; try{d=pctx.getImageData(0,0,w,h).data}catch(e){return}
  var tol=Math.max(3,b.S*.02)*pdpr,tot=0,hitc=0;
  TPLS[tplI].s.forEach(function(st){
    for(var i=1;i<st.length;i++){var a=st[i-1],c=st[i],L=Math.hypot(c[0]-a[0],c[1]-a[1])*b.S,n=Math.max(1,Math.round(L/(b.S*.02)));
      for(var k=0;k<n;k++){var t=k/n,x=(b.x0+(a[0]+(c[0]-a[0])*t)*b.S)*pdpr,y=(b.y0+(a[1]+(c[1]-a[1])*t)*b.S)*pdpr;tot++;
        var offs=[[0,0],[tol,0],[-tol,0],[0,tol],[0,-tol]];
        for(var o=0;o<5;o++){var X=Math.round(x+offs[o][0]),Y=Math.round(y+offs[o][1]);if(X>=0&&Y>=0&&X<w&&Y<h&&d[(Y*w+X)*4+3]>40){hitc++;break}}}}
  });
  var r=hitc/Math.max(1,tot);
  if(r>=.82){traced=true;drawTpl();sfx.win();pconfetti();speakMix([[TPLS[tplI].n+' 완성!','ko-KR']]);document.querySelector('.tool[data-t=fill]').classList.add('pulse');
    $('pmsg').textContent='🎉 '+TPLS[tplI].n+' 완성! 🪣 눌러서 색칠해 봐';}
  else if(r>.4)$('pmsg').textContent='거의 다 왔어! 점선을 끝까지 따라가 봐 ('+Math.round(r*100)+'%)';
}

function pseg(a,b){
  var d=Math.hypot(b[0]-a[0],b[1]-a[1]);
  pctx.lineCap=pctx.lineJoin='round'; pctx.lineWidth=ptool==='eraser'?pw()*1.8:pw();

  else{pctx.globalCompositeOperation='source-over';if(pcolor==='rainbow'){phue=(phue+d*.9)%360;pctx.strokeStyle='hsl('+phue+',95%,55%)'}else pctx.strokeStyle=pcolor}
  pctx.beginPath();pctx.moveTo(a[0],a[1]);pctx.lineTo(b[0],b[1]);pctx.stroke();
  pctx.globalCompositeOperation='source-over';
  pdist+=d; if(pdist>Math.min(PW,PH)*.06){pdist=0;sfx.note()}
}
function hex2rgb(h){var n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255]}
function hsl2rgb(h,s,l){s/=100;l/=100;var k=function(n){return (n+h/30)%12},a=s*Math.min(l,1-l),f=function(n){return l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)))};return [Math.round(f(0)*255),Math.round(f(8)*255),Math.round(f(4)*255)]}
function flood(p){
  var w=pcv.width,h=pcv.height,x=Math.floor(p[0]*pdpr),y=Math.floor(p[1]*pdpr); if(x<0||y<0||x>=w||y>=h)return;
  var pd=pctx.getImageData(0,0,w,h),gd=pgx.getImageData(0,0,w,h),P=pd.data,G=gd.data,n=w*h;
  var col=new Int32Array(n);
  for(var i=0,j=0;i<n;i++,j+=4){var r=255,g=255,b=255;
    if(G[j+3]>60){var ga=G[j+3]/255;r=255-(255-G[j])*ga;g=255-(255-G[j+1])*ga;b=255-(255-G[j+2])*ga}
    if(P[j+3]>0){var pa=P[j+3]/255;r=r*(1-pa)+P[j]*pa;g=g*(1-pa)+P[j+1]*pa;b=b*(1-pa)+P[j+2]*pa}
    col[i]=(r<<16)|(g<<8)|b}
  var s0=col[y*w+x],sr=s0>>16&255,sg=s0>>8&255,sb=s0&255;
  var fc=pcolor==='rainbow'?hsl2rgb(Math.random()*360,90,60):hex2rgb(pcolor);
  var seen=new Uint8Array(n),stack=[y*w+x],T=60;
  function ok(k){if(seen[k])return false;var c=col[k];return Math.abs((c>>16&255)-sr)+Math.abs((c>>8&255)-sg)+Math.abs((c&255)-sb)<T}
  while(stack.length){var k=stack.pop();if(!ok(k))continue;var xx=k%w,l=k,rr=k;
    while(xx>0&&ok(l-1)){l--;xx--}
    var x1=k%w;while(x1<w-1&&ok(rr+1)){rr++;x1++}
    for(var m=l;m<=rr;m++){seen[m]=1;var q=m*4;P[q]=fc[0];P[q+1]=fc[1];P[q+2]=fc[2];P[q+3]=255;
      if(m>=w&&ok(m-w))stack.push(m-w); if(m<n-w&&ok(m+w))stack.push(m+w)}}
  // 경계 1px 메우기 (흰 틈 방지)
  pctx.putImageData(pd,0,0);
}
